<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toks - Pan-African Short-Form Reels | wave.africa</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FE2C55'><path d='M10 15l5.19-3L10 9v6'/></svg>">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/navbar.css">
  <link rel="stylesheet" href="styles/modal.css">
  <link rel="stylesheet" href="styles/features.css">
  <style>
    body { overflow: hidden; background: #000; }
    #toks-viewport::-webkit-scrollbar { display: none; }
    .tok-reel {
      width: 100%;
      height: calc(100vh - var(--nav-height));
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tok-stage {
      position: relative;
      height: 100%;
      width: min(calc((100vh - var(--nav-height)) * 9 / 16), 100%);
      background: #000;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }
    .tok-video-el {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Sizable for every phone without cropping! */
      display: block;
      cursor: pointer;
      background: #000;
      transition: object-fit 0.2s ease;
    }
    .tok-video-el.fill-mode {
      object-fit: cover; /* Optional fill screen mode */
    }
    .tok-play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .tok-play-badge {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.2s, transform 0.2s;
    }
    .tok-play-badge.visible {
      opacity: 1;
      transform: scale(1);
    }
    .tok-play-badge svg {
      width: 34px;
      height: 34px;
      fill: #fff;
    }
    .tok-bottom-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 60px 14px 18px;
      background: linear-gradient(transparent, rgba(0,0,0,0.88));
      z-index: 10;
      pointer-events: none;
    }
    .tok-creator-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      pointer-events: all;
    }
    .tok-creator-name {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
    }
    .tok-creator-handle {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
    }
    .tok-follow-btn {
      background: var(--tt-pink);
      color: #fff;
      border: none;
      border-radius: 9999px;
      padding: 4px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      pointer-events: all;
      transition: background 0.15s;
    }
    .tok-follow-btn.following {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
    }
    .tok-caption {
      font-size: 13px;
      line-height: 1.45;
      color: #eee;
      margin-bottom: 6px;
      pointer-events: all;
      word-break: break-word;
    }
    .tok-caption-text {
      display: inline;
    }
    .tok-more-btn {
      display: inline-block;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      margin-left: 5px;
      padding: 1px 7px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.2);
      font-size: 11px;
      letter-spacing: 0.2px;
      transition: background 0.15s, color 0.15s, transform 0.15s;
      vertical-align: baseline;
      user-select: none;
    }
    .tok-more-btn:hover {
      background: var(--tt-pink);
      color: #fff;
      transform: scale(1.05);
    }
    .tok-translate-btn {
      font-size: 11px;
      color: var(--tt-cyan);
      cursor: pointer;
      pointer-events: all;
      margin-bottom: 8px;
    }
    .tok-music-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      pointer-events: all;
    }
    .tok-action-rail {
      position: absolute;
      right: 12px;
      bottom: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 20;
    }
    .tok-avatar-wrap {
      position: relative;
      cursor: pointer;
      margin-bottom: 4px;
    }
    .tok-avatar-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #fff;
      object-fit: cover;
    }
    .tok-follow-plus {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--tt-pink);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 800;
      border: 2px solid #000;
      cursor: pointer;
    }
    .tok-follow-plus.followed {
      background: #444;
      font-size: 11px;
    }
    .tok-action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: #fff;
    }
    .tok-action-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(30,30,30,0.55);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s;
    }
    .tok-action-btn:hover .tok-action-circle {
      transform: scale(1.12);
    }
    .tok-action-circle svg {
      width: 24px;
      height: 24px;
      fill: #fff;
    }
    .tok-action-btn.liked .tok-action-circle svg {
      fill: var(--tt-pink);
    }
    .tok-action-text {
      font-size: 11px;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .tok-vinyl {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: conic-gradient(#111,#333,#111,#333,#111);
      border: 6px solid #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: tokSpin 4s linear infinite;
    }
    .tok-vinyl img {
      width: 18px;
      height: 18px;
      border-radius: 50%;
    }
    @keyframes tokSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    #tok-comments-drawer.open {
      transform: translateY(0) !important;
    }
    @media (max-width: 600px) {
      #tok-comments-drawer {
        width: 100% !important;
        height: 75vh !important;
        border-top-right-radius: 16px;
      }
    }
    /* ═══════════════════════════════════════════════════════════
       MOBILE SIZING & ADAPTIVE VIEWPORT  (< 900px)
       Sized comfortably for every phone without cutting off nav
    ═══════════════════════════════════════════════════════════ */
    @media (max-width: 899px) {
      .tok-nav-arrows-desktop {
        display: none !important;
      }
      .tok-reel {
        width: 100%;
        /* Subtract top header (56px) + bottom mobile nav (56px) */
        height: calc(100vh - var(--nav-height, 56px) - 56px);
        height: calc(100dvh - var(--nav-height, 56px) - 56px);
        padding: 0;
      }
      .tok-stage {
        width: 100%;
        max-width: 100%;
        height: 100%;
        border-radius: 0;
        box-shadow: none;
      }
      .tok-bottom-overlay {
        padding: 40px 76px 14px 12px;
      }
      .tok-action-rail {
        right: 8px;
        bottom: 14px;
        gap: 12px;
      }
      .tok-action-circle {
        width: 42px;
        height: 42px;
      }
      .tok-action-circle svg {
        width: 22px;
        height: 22px;
      }
      .tok-avatar-img {
        width: 44px;
        height: 44px;
      }
      .tok-vinyl {
        width: 42px;
        height: 42px;
      }
      .tok-vinyl img {
        width: 16px;
        height: 16px;
      }
    }

    /* ═══════════════════════════════════════════════════════════
       DESKTOP WIDE-SCREEN LAYOUT  (≥ 900px)
       Video centred, action rail sits beside it — not overlaid
    ═══════════════════════════════════════════════════════════ */
    @media (min-width: 900px) {
      /* Each reel becomes a row: [video card] [actions on side] */
      .tok-reel {
        display: flex;
        flex-direction: row;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 24px;
        background: #000;
      }

      /* Video card — fixed narrow column, centred */
      .tok-stage {
        position: relative;
        width: 380px;
        max-width: 380px;
        height: min(calc(100vh - var(--nav-height) - 40px), 760px);
        flex-shrink: 0;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 40px rgba(0,0,0,0.9);
      }

      /* Action rail sits to the right of the video */
      .tok-action-rail {
        position: static !important;
        right: unset;
        bottom: unset;
        margin-left: 20px;
        margin-bottom: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        z-index: 20;
        flex-shrink: 0;
      }

      /* Larger action circles on desktop */
      .tok-action-circle {
        width: 52px;
        height: 52px;
      }
      .tok-action-circle svg {
        width: 26px;
        height: 26px;
      }
      .tok-avatar-img {
        width: 54px;
        height: 54px;
      }

      /* Vinyl disc — bigger, pulsing ring on desktop */
      .tok-vinyl {
        width: 54px;
        height: 54px;
        box-shadow: 0 0 0 4px rgba(236,72,153,0.35), 0 0 0 8px rgba(236,72,153,0.12);
      }
      .tok-vinyl img {
        width: 22px;
        height: 22px;
      }

      /* Bottom overlay stays inside video card */
      .tok-bottom-overlay {
        border-radius: 0 0 16px 16px;
      }

      /* Hide old fixed arrow nav on wide screen — arrow keys still work */
      .tok-nav-arrows-desktop {
        display: none !important;
      }
    }

    /* ═══════════════════════════════════════════════════════════
       REPOST BOTTOM SHEET  (TikTok-style)
    ═══════════════════════════════════════════════════════════ */
    #tok-repost-sheet {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0,0,0,0);
      pointer-events: none;
      transition: background 0.28s ease;
    }
    #tok-repost-sheet.open {
      background: rgba(0,0,0,0.55);
      pointer-events: all;
    }
    #tok-repost-panel {
      width: 100%;
      max-width: 480px;
      background: #1a1a1a;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border: 1px solid #333;
      padding: 0 0 calc(env(safe-area-inset-bottom) + 16px);
      transform: translateY(110%);
      transition: transform 0.38s cubic-bezier(0.16,1,0.3,1);
      overflow: hidden;
    }
    #tok-repost-sheet.open #tok-repost-panel {
      transform: translateY(0);
    }
    .repost-handle {
      width: 36px;
      height: 4px;
      background: #444;
      border-radius: 9999px;
      margin: 10px auto 0;
    }
    .repost-sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 10px;
      border-bottom: 1px solid #2a2a2a;
    }
    .repost-sheet-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .repost-sheet-title svg {
      width: 18px;
      height: 18px;
      fill: #10b981;
    }
    .repost-sheet-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #2a2a2a;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Tok preview row inside sheet */
    .repost-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: #111;
      margin: 10px 16px;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
    }
    .repost-preview-thumb {
      width: 48px;
      height: 64px;
      border-radius: 8px;
      object-fit: cover;
      background: #333;
      flex-shrink: 0;
    }
    .repost-preview-info {
      flex: 1;
      overflow: hidden;
    }
    .repost-preview-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .repost-preview-creator {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }
    /* Note field */
    .repost-note-wrap {
      padding: 0 16px;
      margin-top: 4px;
    }
    .repost-note-label {
      font-size: 11px;
      color: #888;
      margin-bottom: 6px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    #repost-note-input {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 13px;
      resize: none;
      outline: none;
      font-family: inherit;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    #repost-note-input:focus {
      border-color: #10b981;
    }
    #repost-note-input::placeholder { color: #555; }
    /* Action buttons */
    .repost-actions {
      display: flex;
      gap: 10px;
      padding: 14px 16px 0;
    }
    #btn-repost-confirm {
      flex: 1;
      padding: 13px;
      border-radius: 12px;
      background: #10b981;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: opacity 0.15s, transform 0.1s;
    }
    #btn-repost-confirm:active { transform: scale(0.97); opacity: 0.85; }
    #btn-repost-confirm svg { width:18px;height:18px;fill:#fff; }
    #btn-repost-remove {
      padding: 13px 18px;
      border-radius: 12px;
      background: #2a2a2a;
      color: #f87171;
      font-size: 14px;
      font-weight: 700;
      border: 1px solid #444;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s;
    }
    #btn-repost-remove.visible { display: flex; }

    /* Reposted badge on the reel — top of video, like TikTok */
    .tok-repost-badge {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(16,185,129,0.4);
      border-radius: 9999px;
      padding: 4px 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #10b981;
      font-weight: 700;
      pointer-events: none;
      white-space: nowrap;
      z-index: 15;
      animation: repostBadgePop 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes repostBadgePop {
      from { opacity:0; transform: translateX(-50%) scale(0.7); }
      to   { opacity:1; transform: translateX(-50%) scale(1); }
    }
  </style>
</head>
<body data-page="toks">
  <div id="app" style="display:flex;flex-direction:column;width:100%;height:100vh;">
    <div id="navbar-container"></div>
    <div style="flex:1;display:flex;overflow:hidden;background:#000;" id="toks-shell">
      <div id="sidebar-container"></div>
      <div id="toks-viewport" style="flex:1;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000;"></div>
      <div id="tok-nav-arrows" class="tok-nav-arrows-desktop" style="position:fixed;right:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:200;">
        <button id="btn-tok-prev" style="width:46px;height:46px;border-radius:50%;background:rgba(40,40,40,0.8);border:1px solid #444;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;">
          <svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:currentColor"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
        </button>
        <button id="btn-tok-next" style="width:46px;height:46px;border-radius:50%;background:rgba(40,40,40,0.8);border:1px solid #444;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;">
          <svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
        </button>
      </div>
    </div>
    <div id="tok-comments-drawer" style="position:fixed;bottom:0;right:0;width:420px;height:72vh;background:rgba(20,20,20,0.98);backdrop-filter:blur(20px);border-top-left-radius:16px;border:1px solid #333;z-index:2000;display:flex;flex-direction:column;transform:translateY(105%);transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);">
      <div style="padding:16px 20px;border-bottom:1px solid #333;display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:15px;font-weight:700;" data-i18n="comments">Comments</span>
        <button id="btn-close-comments" style="width:32px;height:32px;border-radius:50%;background:none;border:none;color:#aaa;cursor:pointer;font-size:18px;">✕</button>
      </div>
      <div id="drawer-comments-list" style="flex:1;overflow-y:auto;padding:12px 20px;"></div>
      
      <!-- Replying To Banner -->
      <div id="replying-banner" style="display:none; padding:8px 16px; background:#222; border-top:1px solid #333; font-size:12px; color:var(--text-secondary); justify-content:space-between; align-items:center;">
        <span>Replying to <strong id="replying-to-user" style="color:var(--tt-cyan);">@user</strong></span>
        <button id="btn-cancel-reply" style="background:none; border:none; color:#aaa; cursor:pointer; font-size:14px;">✕ Cancel</button>
      </div>

      <div style="padding:12px 16px;border-top:1px solid #333;display:flex;gap:10px;background:#181818;">
        <input type="text" id="drawer-comment-input" placeholder="Add a TikTok comment or reply..." style="flex:1;background:#121212;border:1px solid #333;border-radius:9999px;padding:10px 16px;color:#fff;font-size:14px;outline:none;">
        <button id="btn-drawer-send" class="btn-primary" style="padding:8px 18px;">Post</button>
      </div>
    </div>
    <!-- Repost Bottom Sheet (TikTok-style) -->
    <div id="tok-repost-sheet" onclick="if(event.target === this) window.closeRepostSheet();">
      <div id="tok-repost-panel" onclick="event.stopPropagation();">
        <div class="repost-handle"></div>
        <div class="repost-sheet-header">
          <div class="repost-sheet-title">
            <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            <span id="repost-sheet-heading">Repost Tok</span>
          </div>
          <button class="repost-sheet-close" onclick="window.closeRepostSheet()" aria-label="Close">✕</button>
        </div>
        <div class="repost-preview">
          <img id="repost-preview-img" class="repost-preview-thumb" src="" alt="Thumbnail">
          <div class="repost-preview-info">
            <div id="repost-preview-title" class="repost-preview-title">Video title</div>
            <div id="repost-preview-creator" class="repost-preview-creator">@creator</div>
          </div>
        </div>
        <div class="repost-note-wrap">
          <div class="repost-note-label">Add your thoughts (optional)</div>
          <textarea id="repost-note-input" rows="2" placeholder="Say something about this repost..."></textarea>
        </div>
        <div class="repost-actions">
          <button id="btn-repost-remove" onclick="window.confirmRemoveRepost()">
            <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor;"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            <span>Remove</span>
          </button>
          <button id="btn-repost-confirm" onclick="window.confirmSubmitRepost()">
            <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            <span id="btn-repost-confirm-text">Repost</span>
          </button>
        </div>
      </div>
    </div>
    <div id="mobile-bottom-nav-container"></div>
  </div>

  <script src="js/algorithm.js"></script>
  <script src="js/core.js"></script>
  <script src="js/toks-feed.js"></script>
</body>
</html>
