<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toks - Pan-African Short-Form Reels | TokTube</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FE2C55'><path d='M10 15l5.19-3L10 9v6'/></svg>">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/navbar.css">
  <link rel="stylesheet" href="styles/modal.css">
  <link rel="stylesheet" href="styles/features.css">
  <style>
    body { overflow: hidden; background: #000; }
    #toks-viewport::-webkit-scrollbar { display: none; }
    .tok-reel {
      width: 100%;
      height: calc(100vh - var(--nav-height));
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tok-stage {
      position: relative;
      height: 100%;
      width: min(calc((100vh - var(--nav-height)) * 9 / 16), 100%);
      background: #000;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }
    .tok-video-el {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }
    .tok-play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .tok-play-badge {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.2s, transform 0.2s;
    }
    .tok-play-badge.visible {
      opacity: 1;
      transform: scale(1);
    }
    .tok-play-badge svg {
      width: 34px;
      height: 34px;
      fill: #fff;
    }
    .tok-bottom-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 60px 14px 18px;
      background: linear-gradient(transparent, rgba(0,0,0,0.88));
      z-index: 10;
      pointer-events: none;
    }
    .tok-creator-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      pointer-events: all;
    }
    .tok-creator-name {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
    }
    .tok-creator-handle {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
    }
    .tok-follow-btn {
      background: var(--tt-pink);
      color: #fff;
      border: none;
      border-radius: 9999px;
      padding: 4px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      pointer-events: all;
      transition: background 0.15s;
    }
    .tok-follow-btn.following {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
    }
    .tok-caption {
      font-size: 13px;
      line-height: 1.4;
      color: #eee;
      margin-bottom: 6px;
      pointer-events: all;
    }
    .tok-translate-btn {
      font-size: 11px;
      color: var(--tt-cyan);
      cursor: pointer;
      pointer-events: all;
      margin-bottom: 8px;
    }
    .tok-music-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      pointer-events: all;
    }
    .tok-action-rail {
      position: absolute;
      right: 12px;
      bottom: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 20;
    }
    .tok-avatar-wrap {
      position: relative;
      cursor: pointer;
      margin-bottom: 4px;
    }
    .tok-avatar-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #fff;
      object-fit: cover;
    }
    .tok-follow-plus {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--tt-pink);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 800;
      border: 2px solid #000;
      cursor: pointer;
    }
    .tok-follow-plus.followed {
      background: #444;
      font-size: 11px;
    }
    .tok-action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: #fff;
    }
    .tok-action-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(30,30,30,0.55);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s;
    }
    .tok-action-btn:hover .tok-action-circle {
      transform: scale(1.12);
    }
    .tok-action-circle svg {
      width: 24px;
      height: 24px;
      fill: #fff;
    }
    .tok-action-btn.liked .tok-action-circle svg {
      fill: var(--tt-pink);
    }
    .tok-action-text {
      font-size: 11px;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .tok-vinyl {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: conic-gradient(#111,#333,#111,#333,#111);
      border: 6px solid #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: tokSpin 4s linear infinite;
    }
    .tok-vinyl img {
      width: 18px;
      height: 18px;
      border-radius: 50%;
    }
    @keyframes tokSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    #tok-comments-drawer.open {
      transform: translateY(0) !important;
    }
    @media (max-width: 600px) {
      #tok-comments-drawer {
        width: 100% !important;
        height: 75vh !important;
        border-top-right-radius: 16px;
      }
    }
    @media (max-width: 900px) {
      .tok-nav-arrows-desktop {
        display: none !important;
      }
    }

    /* ═══════════════════════════════════════════════════════════
       DESKTOP WIDE-SCREEN LAYOUT  (≥ 900px)
       Video centred, action rail sits beside it — not overlaid
    ═══════════════════════════════════════════════════════════ */
    @media (min-width: 900px) {
      /* Each reel becomes a row: [gap] [video card] [actions] [gap] */
      .tok-reel {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 0;
        background: #000;
      }

      /* Video card — fixed narrow column, centred */
      .tok-stage {
        position: relative;
        width: 360px;
        max-width: 360px;
        flex-shrink: 0;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 40px rgba(0,0,0,0.9);
      }

      /* Action rail comes OUT of the video — sits to the right */
      .tok-action-rail {
        position: static !important;  /* override absolute */
        right: unset;
        bottom: unset;
        margin-left: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        z-index: 20;
        flex-shrink: 0;
      }

      /* Larger action circles on desktop */
      .tok-action-circle {
        width: 52px;
        height: 52px;
      }
      .tok-action-circle svg {
        width: 26px;
        height: 26px;
      }
      .tok-avatar-img {
        width: 54px;
        height: 54px;
      }

      /* Vinyl disc — bigger, pulsing ring on desktop */
      .tok-vinyl {
        width: 54px;
        height: 54px;
        box-shadow: 0 0 0 4px rgba(236,72,153,0.35), 0 0 0 8px rgba(236,72,153,0.12);
      }
      .tok-vinyl img {
        width: 22px;
        height: 22px;
      }

      /* Bottom overlay stays inside video card */
      .tok-bottom-overlay {
        border-radius: 0 0 16px 16px;
      }

      /* Hide old fixed arrow nav on wide screen — arrow keys still work */
      .tok-nav-arrows-desktop {
        display: none !important;
      }
    }

    /* ── Location Modal ────────────────────────────────────────────────── */
    #location-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(10px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #location-modal-overlay.hidden { display: none; }
    #location-modal-box {
      background: #141414;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 32px 28px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
  </style>
</head>
<body data-page="toks">
  <div id="app" style="display:flex;flex-direction:column;width:100%;height:100vh;">
    <div id="navbar-container"></div>
    <div style="flex:1;display:flex;overflow:hidden;background:#000;" id="toks-shell">
      <div id="sidebar-container"></div>
      <div id="toks-viewport" style="flex:1;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000;"></div>
      <div id="tok-nav-arrows" class="tok-nav-arrows-desktop" style="position:fixed;right:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:200;">
        <button id="btn-tok-prev" style="width:46px;height:46px;border-radius:50%;background:rgba(40,40,40,0.8);border:1px solid #444;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;">
          <svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:currentColor"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
        </button>
        <button id="btn-tok-next" style="width:46px;height:46px;border-radius:50%;background:rgba(40,40,40,0.8);border:1px solid #444;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;">
          <svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
        </button>
      </div>
    </div>
    <div id="tok-comments-drawer" style="position:fixed;bottom:0;right:0;width:420px;height:72vh;background:rgba(20,20,20,0.98);backdrop-filter:blur(20px);border-top-left-radius:16px;border:1px solid #333;z-index:2000;display:flex;flex-direction:column;transform:translateY(105%);transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);">
      <div style="padding:16px 20px;border-bottom:1px solid #333;display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:15px;font-weight:700;" data-i18n="comments">Comments</span>
        <button id="btn-close-comments" style="width:32px;height:32px;border-radius:50%;background:none;border:none;color:#aaa;cursor:pointer;font-size:18px;">✕</button>
      </div>
      <div id="drawer-comments-list" style="flex:1;overflow-y:auto;padding:12px 20px;"></div>
      
      <!-- Replying To Banner -->
      <div id="replying-banner" style="display:none; padding:8px 16px; background:#222; border-top:1px solid #333; font-size:12px; color:var(--text-secondary); justify-content:space-between; align-items:center;">
        <span>Replying to <strong id="replying-to-user" style="color:var(--tt-cyan);">@user</strong></span>
        <button id="btn-cancel-reply" style="background:none; border:none; color:#aaa; cursor:pointer; font-size:14px;">✕ Cancel</button>
      </div>

      <div style="padding:12px 16px;border-top:1px solid #333;display:flex;gap:10px;background:#181818;">
        <input type="text" id="drawer-comment-input" placeholder="Add a TikTok comment or reply..." style="flex:1;background:#121212;border:1px solid #333;border-radius:9999px;padding:10px 16px;color:#fff;font-size:14px;outline:none;">
        <button id="btn-drawer-send" class="btn-primary" style="padding:8px 18px;">Post</button>
      </div>
    </div>
    <div id="mobile-bottom-nav-container"></div>
  </div>

  <!-- ── Location Personalisation Modal ────────────────────────────── -->
  <div id="location-modal-overlay" class="hidden">
    <div id="location-modal-box">
      <div style="font-size:40px;margin-bottom:12px;">📍</div>
      <h2 style="font-size:20px;font-weight:800;color:#fff;margin-bottom:8px;">Personalise Your Feed</h2>
      <p style="font-size:13px;color:#aaa;line-height:1.5;margin-bottom:24px;">
        TokTube Africa tailors your Toks feed to your location — showing more content from your country and region. Share your location to get started.
      </p>

      <!-- Auto-detect -->
      <button id="btn-use-gps" onclick="window.detectGPSLocation()" style="width:100%;padding:14px;background:var(--tt-pink);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px;">
        📡 Use My Current Location
      </button>

      <!-- Manual country pick -->
      <div style="margin-bottom:16px;">
        <p style="font-size:12px;color:#666;margin-bottom:8px;">Or choose your country:</p>
        <select id="location-country-select" style="width:100%;padding:12px 14px;background:#1e1e1e;border:1px solid #333;border-radius:10px;color:#fff;font-size:14px;outline:none;">
          <option value="">— Select Country —</option>
          <option value="Zambia">🇿🇲 Zambia</option>
          <option value="Nigeria">🇳🇬 Nigeria</option>
          <option value="South Africa">🇿🇦 South Africa</option>
          <option value="Kenya">🇰🇪 Kenya</option>
          <option value="Ghana">🇬🇭 Ghana</option>
          <option value="Ethiopia">🇪🇹 Ethiopia</option>
          <option value="Tanzania">🇹🇿 Tanzania</option>
          <option value="Uganda">🇺🇬 Uganda</option>
          <option value="Zimbabwe">🇿🇼 Zimbabwe</option>
          <option value="Mozambique">🇲🇿 Mozambique</option>
          <option value="Senegal">🇸🇳 Senegal</option>
          <option value="Cameroon">🇨🇲 Cameroon</option>
          <option value="Côte d'Ivoire">🇨🇮 Côte d'Ivoire</option>
          <option value="Angola">🇦🇴 Angola</option>
          <option value="DR Congo">🇨🇩 DR Congo</option>
          <option value="Rwanda">🇷🇼 Rwanda</option>
          <option value="Egypt">🇪🇬 Egypt</option>
          <option value="Morocco">🇲🇦 Morocco</option>
          <option value="Other Africa">🌍 Other African Country</option>
        </select>
      </div>

      <button id="btn-save-location" onclick="window.saveManualLocation()" style="width:100%;padding:13px;background:#1e1e1e;color:#fff;border:1px solid #333;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:10px;">
        ✅ Save &amp; Continue
      </button>
      <button onclick="window.skipLocationSetup()" style="background:none;border:none;color:#555;font-size:13px;cursor:pointer;width:100%;padding:8px;">
        Skip for now
      </button>
    </div>
  </div>

  <script src="js/algorithm.js" type="module"></script>
  <script src="js/core.js"></script>
  <script>
    // ── Location modal logic ────────────────────────────────────────────
    (function() {
      function shouldShowLocationModal() {
        return !localStorage.getItem('toktube_user_location');
      }

      function showLocationModal() {
        const overlay = document.getElementById('location-modal-overlay');
        if (overlay) overlay.classList.remove('hidden');
      }

      function hideLocationModal() {
        const overlay = document.getElementById('location-modal-overlay');
        if (overlay) overlay.classList.add('hidden');
      }

      function saveLocation(data) {
        localStorage.setItem('toktube_user_location', JSON.stringify(data));
        hideLocationModal();
        if (window.tokShell) tokShell.showToast(`📍 Feed personalised for ${data.country || data.city || 'your location'} 🌍`);
      }

      window.detectGPSLocation = function() {
        const btn = document.getElementById('btn-use-gps');
        if (btn) btn.textContent = '⏳ Detecting...';
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            try {
              const { latitude, longitude } = pos.coords;
              const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
              const data = await resp.json();
              const country = data.address?.country || 'Africa';
              const city    = data.address?.city || data.address?.town || data.address?.village || '';
              saveLocation({ country, city, continent: 'Africa', lat: latitude, lon: longitude });
            } catch(e) {
              saveLocation({ country: 'Africa', city: '', continent: 'Africa' });
            }
          },
          () => {
            if (btn) btn.textContent = '📡 Use My Current Location';
            if (window.tokShell) tokShell.showToast('Could not get GPS. Please choose a country.');
          },
          { timeout: 8000 }
        );
      };

      window.saveManualLocation = function() {
        const sel = document.getElementById('location-country-select');
        const country = sel ? sel.value : '';
        if (!country) {
          if (window.tokShell) tokShell.showToast('Please select your country first.');
          return;
        }
        saveLocation({ country, city: '', continent: 'Africa' });
      };

      window.skipLocationSetup = function() {
        // Mark as skipped so we don't ask again this session
        sessionStorage.setItem('toktube_location_skipped', '1');
        hideLocationModal();
      };

      // Show modal once the page is ready and location hasn't been set
      window.addEventListener('load', () => {
        const skipped = sessionStorage.getItem('toktube_location_skipped');
        if (shouldShowLocationModal() && !skipped) {
          // Slight delay so the page can render first
          setTimeout(showLocationModal, 1200);
        }
      });
    })();
  </script>
  <script src="js/toks-feed.js"></script>
</body>
</html>
