<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Video - TokTube Africa</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FE2C55'><path d='M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 21c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 3c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z'/></svg>">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/navbar.css">
  <link rel="stylesheet" href="styles/watch.css">
  <link rel="stylesheet" href="styles/modal.css">
  <link rel="stylesheet" href="styles/features.css">
</head>
<body data-page="watch">
  <div id="app">
    <!-- Injected Global Header -->
    <div id="navbar-container"></div>

    <div id="main-content">
      <!-- Injected Global Sidebar -->
      <div id="sidebar-container"></div>

      <!-- Dedicated Video Watch Page -->
      <main class="page-main">
        <div class="page-content" style="max-width: 1650px;">
          <div class="watch-layout">
            <!-- Left Column: Player, Video Info, Comments -->
            <div class="watch-primary">
              <!-- Custom Video Player -->
              <div id="main-player-container" class="player-container">
                <video id="main-watch-video" class="main-video" playsinline></video>
                <div class="player-controls">
                  <div class="timeline-container" id="timeline-container">
                    <div class="timeline-bar">
                      <div class="timeline-progress" id="timeline-progress" style="width: 0%;"></div>
                    </div>
                  </div>
                  <div class="controls-row">
                    <div class="controls-left">
                      <button class="control-btn" id="btn-play-toggle" title="Play/Pause (Space)">
                        <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg class="icon-pause" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                      </button>
                      <div class="volume-control-wrap" style="display:inline-flex; align-items:center; gap:6px;">
                        <button class="control-btn" id="btn-volume-toggle" title="Mute/Unmute (M)">
                          <svg id="icon-vol-high" class="icon-volume-high" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                          <svg id="icon-vol-mute" class="icon-volume-mute" viewBox="0 0 24 24" style="display: none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                        </button>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" style="width:70px; height:4px; accent-color:var(--yt-red); cursor:pointer;" title="Volume Slider">
                      </div>
                      <span class="time-display" id="time-display">0:00 / 0:00</span>
                    </div>
                    <div class="controls-right" style="display:flex; align-items:center; gap:8px;">
                      <!-- Quality Selector -->
                      <div class="quality-selector-wrap" style="position:relative; display:inline-flex; align-items:center;">
                        <select id="btn-watch-quality" title="Video Quality" style="background:rgba(0,0,0,0.6); color:#fff; border:1px solid rgba(255,255,255,0.3); border-radius:4px; padding:4px 8px; font-size:12px; font-weight:700; cursor:pointer; outline:none;">
                          <option value="1080p">1080p HD</option>
                          <option value="720p" selected>720p HD</option>
                          <option value="480p">480p</option>
                          <option value="360p">360p</option>
                        </select>
                      </div>
                      <button class="control-btn" id="btn-theater-toggle" title="Theater Mode">
                        <svg viewBox="0 0 24 24"><path d="M19 6H5c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H5V8h14v8z"/></svg>
                      </button>
                      <button class="control-btn" id="btn-fullscreen-toggle" title="Fullscreen">
                        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Video Metadata Header -->
              <h1 id="watch-video-title" style="font-size: 20px; font-weight: 800; margin-top: 16px; line-height: 1.35;">
                Video Title
              </h1>

              <!-- Creator Channel Bar & Action Buttons -->
              <div class="watch-actions-bar" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; margin-top: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--border-subtle);">
                <div class="watch-channel-info" style="display: flex; align-items: center; gap: 12px;">
                  <img id="watch-channel-avatar" src="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover; cursor: pointer;" title="View channel">
                  <div>
                    <h3 id="watch-channel-name" style="font-size: 15px; font-weight: 700; cursor:pointer;" title="View channel">Channel Name</h3>
                    <span id="watch-channel-subscribers" style="font-size: 12px; color: var(--text-muted);">340K subscribers</span>
                  </div>
                  <button id="btn-watch-subscribe" class="btn-primary" style="margin-left: 12px; padding: 8px 18px; font-size: 13px;">
                    Follow
                  </button>
                </div>

                <div class="watch-buttons-group">
                  <button id="btn-watch-like" class="watch-action-pill" title="Like">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <span id="watch-like-count">24.5K</span>
                  </button>
                  <button id="btn-watch-share" class="watch-action-pill" title="Share">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                    <span data-i18n="share">Share</span>
                  </button>
                  <button id="btn-watch-download" class="watch-action-pill" title="Save offline">
                    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                    <span id="watch-download-label">Save</span>
                  </button>
                  <button id="btn-watch-tip" class="watch-action-pill watch-pill-tip" title="Tip creator">
                    <span>☕</span>
                    <span data-i18n="tip_creator">Tip</span>
                  </button>
                </div>
              </div>

              <!-- Video Description Card -->
              <div class="watch-description-box" style="background: var(--bg-card); border-radius: var(--radius-md); padding: 16px; margin-top: 16px;">
                <div style="font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px;">
                  <span id="watch-views-count">312,000 views</span> • <span id="watch-date">2 days ago</span> • <span id="watch-category-tag" class="badge badge-edu">STEM</span>
                </div>
                <p id="watch-desc-text" style="font-size: 14px; line-height: 1.5; color: var(--text-primary);"></p>
                <div id="btn-translate-desc" class="btn-translate-caption" style="margin-top: 10px; font-size: 12px;">
                  🌍 Translate into current African language
                </div>
              </div>

              <!-- Comments Section -->
              <div class="watch-comments-section" style="margin-top: 24px;">
                <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 16px;">
                  💬 <span data-i18n="comments">Comments</span> (<span id="comments-count">2</span>)
                </h3>
                <div style="display: flex; gap: 12px; margin-bottom: 24px;">
                  <div class="user-avatar" id="commenter-avatar" style="width: 38px; height: 38px; flex-shrink: 0;">P</div>
                  <div style="flex: 1; display: flex; gap: 8px;">
                    <input type="text" id="watch-comment-input" class="form-input" placeholder="Add a public comment...">
                    <button id="btn-post-comment" class="btn-primary" style="white-space: nowrap;">Post</button>
                  </div>
                </div>

                <div id="watch-comments-list" style="display: flex; flex-direction: column; gap: 16px;">
                  <!-- Dynamic Comments -->
                </div>
              </div>
            </div>

            <!-- Right Column: Related African Videos Recommendations Queue -->
            <div class="watch-secondary">
              <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 14px;">Up Next & Related</h3>
              <div class="related-videos-list" id="related-videos-list" style="display: flex; flex-direction: column; gap: 12px;">
                <!-- Dynamically populated -->
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Injected Mobile Bottom Navigation -->
    <div id="mobile-bottom-nav-container"></div>
  </div>

  <!-- Shared Core Scripts -->
  <script src="js/core.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const videoId = urlParams.get('v') || 'tube-1';
      const video = storage.getYoutubeVideoById(videoId) || storage.getYoutubeVideos()[0];

      if (!video) return;

      // Add to watch history
      storage.addToHistory(video.id);

      // DOM Elements
      const videoEl = document.getElementById('main-watch-video');
      const titleEl = document.getElementById('watch-video-title');
      const avatarEl = document.getElementById('watch-channel-avatar');
      const nameEl = document.getElementById('watch-channel-name');
      const subsEl = document.getElementById('watch-channel-subscribers');
      const descEl = document.getElementById('watch-desc-text');
      const viewsEl = document.getElementById('watch-views-count');
      const dateEl = document.getElementById('watch-date');
      const catEl = document.getElementById('watch-category-tag');
      const likeBtn = document.getElementById('btn-watch-like');
      const likeCountEl = document.getElementById('watch-like-count');
      const subBtn = document.getElementById('btn-watch-subscribe');
      const shareBtn = document.getElementById('btn-watch-share');
      const tipBtn = document.getElementById('btn-watch-tip');
      const downBtn = document.getElementById('btn-watch-download');
      const downLabel = document.getElementById('watch-download-label');
      const transBtn = document.getElementById('btn-translate-desc');

      // Populate metadata
      titleEl.textContent = video.title;
      avatarEl.src = video.channel.avatar;
      nameEl.textContent = video.channel.name;
      subsEl.textContent = `${video.channel.subscribers || '250K'} subscribers`;

      // Navigate to channel page when clicking avatar or channel name
      const channelId = (video.channel && video.channel.id) ? video.channel.id : 'ch-amina';
      const goToChannel = () => { window.location.href = `channel.html?id=${channelId}`; };
      avatarEl.onclick = goToChannel;
      nameEl.onclick = goToChannel;

      descEl.textContent = video.description;
      viewsEl.textContent = `${(video.views || 0).toLocaleString()} views`;
      dateEl.textContent = video.timestamp;
      catEl.textContent = video.category || 'General';
      likeCountEl.textContent = (video.likes || 0).toLocaleString();

      // Video playback with IndexedDB user video persistence and fallback handling
      storage.getVideoBlob(video.id).then(blobUrl => {
        if (blobUrl) {
          videoEl.src = blobUrl;
        } else {
          videoEl.src = video.videoUrl || "https://vjs.zencdn.net/v/oceans.mp4";
        }

        videoEl.onerror = () => {
          // If blob or primary fails, fallback to clean nature video
          videoEl.src = "https://vjs.zencdn.net/v/oceans.mp4";
          videoEl.play().catch(() => {});
        };

        videoEl.play().catch(() => {
          // Browser autoplay policy: try muted autoplay if unmuted fails
          videoEl.muted = true;
          videoEl.play().catch(() => {});
        });
      });

      // Custom Controls
      const playBtn = document.getElementById('btn-play-toggle');
      const iconPlay = playBtn.querySelector('.icon-play');
      const iconPause = playBtn.querySelector('.icon-pause');
      const timeDisplay = document.getElementById('time-display');
      const timelineProgress = document.getElementById('timeline-progress');
      const timelineContainer = document.getElementById('timeline-container');

      function formatTime(s) {
        const mins = Math.floor(s / 60);
        const secs = Math.floor(s % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }

      playBtn.addEventListener('click', () => {
        if (videoEl.paused) {
          videoEl.play();
          iconPlay.style.display = 'none';
          iconPause.style.display = 'block';
        } else {
          videoEl.pause();
          iconPlay.style.display = 'block';
          iconPause.style.display = 'none';
        }
      });

      videoEl.addEventListener('play', () => {
        iconPlay.style.display = 'none';
        iconPause.style.display = 'block';
      });

      videoEl.addEventListener('pause', () => {
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
      });

      videoEl.addEventListener('timeupdate', () => {
        if (videoEl.duration) {
          const pct = (videoEl.currentTime / videoEl.duration) * 100;
          timelineProgress.style.width = `${pct}%`;
          timeDisplay.textContent = `${formatTime(videoEl.currentTime)} / ${formatTime(videoEl.duration)}`;
        }
      });

      timelineContainer.addEventListener('click', (e) => {
        const rect = timelineContainer.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const pct = clickX / rect.width;
        videoEl.currentTime = pct * videoEl.duration;
      });

      // Volume & Mute Controls
      const volBtn = document.getElementById('btn-volume-toggle');
      const volSlider = document.getElementById('volume-slider');
      const iconVolHigh = document.getElementById('icon-vol-high');
      const iconVolMute = document.getElementById('icon-vol-mute');
      let lastVolume = 1;

      function updateVolUI(vol, isMuted) {
        if (isMuted || vol === 0) {
          if (iconVolHigh) iconVolHigh.style.display = 'none';
          if (iconVolMute) iconVolMute.style.display = 'block';
          if (volSlider) volSlider.value = 0;
        } else {
          if (iconVolHigh) iconVolHigh.style.display = 'block';
          if (iconVolMute) iconVolMute.style.display = 'none';
          if (volSlider) volSlider.value = vol;
        }
      }

      volSlider?.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        videoEl.volume = val;
        videoEl.muted = val === 0;
        if (val > 0) lastVolume = val;
        updateVolUI(val, videoEl.muted);
      });

      volBtn?.addEventListener('click', () => {
        if (videoEl.muted || videoEl.volume === 0) {
          videoEl.muted = false;
          videoEl.volume = lastVolume > 0 ? lastVolume : 0.8;
          updateVolUI(videoEl.volume, false);
        } else {
          lastVolume = videoEl.volume > 0 ? videoEl.volume : 1;
          videoEl.muted = true;
          updateVolUI(0, true);
        }
      });

      const qualitySelect = document.getElementById('btn-watch-quality');
      qualitySelect?.addEventListener('change', (e) => {
        const quality = e.target.value;
        tokShell.showToast(`Resolution switched to ${quality} ✨`);
        soundFX.playSwitchSound();
      });

      // Keyboard shortcut M for mute
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'm' || e.key === 'M') {
          volBtn?.click();
        }
      });

      // Theater & Fullscreen
      document.getElementById('btn-theater-toggle')?.addEventListener('click', () => {
        document.getElementById('main-player-container').classList.toggle('theater-mode');
      });

      document.getElementById('btn-fullscreen-toggle')?.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.getElementById('main-player-container').requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      // Like toggle
      const isLiked = storage.isLiked(video.id);
      likeBtn.classList.toggle('active', isLiked);
      likeBtn.addEventListener('click', () => {
        soundFX.playLikeSound();
        const nowLiked = storage.toggleLike(video.id);
        likeBtn.classList.toggle('active', nowLiked);
        tokShell.showToast(nowLiked ? 'Added to Liked Videos ❤️' : 'Removed from Liked Videos');
      });

      // Follow toggle (replaces subscribe)
      const isSub = storage.isSubscribed(video.channel.id);
      subBtn.textContent = isSub ? 'Following ✓' : 'Follow';
      subBtn.classList.toggle('subscribed', isSub);
      subBtn.addEventListener('click', () => {
        soundFX.playSubscribeSound();
        const nowSub = storage.toggleSubscribe(video.channel.id);
        subBtn.textContent = nowSub ? 'Following ✓' : 'Follow';
        subBtn.classList.toggle('subscribed', nowSub);
        tokShell.showToast(nowSub ? 'Following creator ✓' : 'Unfollowed');
      });

      // Offline Download
      const isDown = storage.isDownloaded(video.id);
      if (isDown) {
        downBtn.classList.add('active');
        downLabel.textContent = i18n.t('downloaded');
      }
      downBtn.addEventListener('click', () => {
        soundFX.playNotificationSound();
        const nowDown = storage.toggleOfflineDownload(video.id);
        downBtn.classList.toggle('active', nowDown);
        downLabel.textContent = nowDown ? i18n.t('downloaded') : 'Save Offline';
        tokShell.showToast(nowDown ? 'Saved offline (Data Saver Mode) 📥' : 'Removed from offline storage');
      });

      // Tip Creator
      tipBtn.addEventListener('click', () => {
        tokShell.openTippingModal(video.channel.id);
      });

      // Share
      shareBtn.addEventListener('click', () => {
        tokShell.openShareModal(window.location.href, video.title);
      });

      // Description Translation
      transBtn.addEventListener('click', () => {
        soundFX.playNotificationSound();
        descEl.textContent = i18n.translateContent(video.description);
        tokShell.showToast(i18n.t('translated_by'));
      });

      // Populate commenter avatar
      const userProfile = storage.getUserProfile();
      const commenterAvatarEl = document.getElementById('commenter-avatar');
      if (commenterAvatarEl) {
        if (userProfile.avatarUrl) {
          commenterAvatarEl.innerHTML = `<img src="${userProfile.avatarUrl}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
        } else {
          commenterAvatarEl.textContent = userProfile.avatarLetter || 'P';
        }
      }

      // Render Comments with Persistence and Replies
      const commentsList = document.getElementById('watch-comments-list');
      const commentsCount = document.getElementById('comments-count');
      const commentInput = document.getElementById('watch-comment-input');
      const postBtn = document.getElementById('btn-post-comment');

      let comments = storage.getVideoComments(video.id);
      if (!comments || comments.length === 0) {
        comments = [
          { id: "c1", author: "Kofi Annan", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100", text: "Brilliant engineering! This is exactly what we need in Africa.", time: "1 day ago", likes: 142, replies: [] },
          { id: "c2", author: "Sipho Khumalo", avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100", text: "Following this schematic for our community farm. Asante sana!", time: "18 hours ago", likes: 89, replies: [] }
        ];
      }

      let activeReplyToId = null;

      function renderComments() {
        let totalCount = comments.length;
        comments.forEach(c => { if (c.replies) totalCount += c.replies.length; });
        commentsCount.textContent = totalCount;

        commentsList.innerHTML = comments.map(c => {
          const repliesHtml = (c.replies && c.replies.length > 0) ? `
            <div style="margin-top: 10px; margin-left: 20px; padding-left: 12px; border-left: 2px solid var(--border-subtle); display: flex; flex-direction: column; gap: 10px;">
              ${c.replies.map(r => `
                <div style="display: flex; gap: 10px;">
                  <img src="${r.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'}" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0;">
                  <div style="flex: 1;">
                    <div style="font-size: 12px; font-weight: 700;">
                      <span>${r.author}</span>
                      <span style="font-size: 11px; font-weight: 400; color: var(--text-muted); margin-left: 6px;">${r.time}</span>
                    </div>
                    <p style="font-size: 13px; margin-top: 2px; line-height: 1.4;">${r.text}</p>
                    <div style="display: flex; align-items: center; gap: 10px; margin-top: 4px; font-size: 11px; color: var(--text-muted);">
                      <button style="cursor: pointer; display: flex; align-items: center; gap: 4px; background: none; border: none; color: var(--text-muted);" onclick="window.likeWatchComment('${c.id}', true, '${r.id}')">
                        👍 <span>${r.likes || 1}</span>
                      </button>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : '';

          const replyBoxHtml = (activeReplyToId === c.id) ? `
            <div style="margin-top: 10px; display: flex; gap: 8px;">
              <input type="text" id="reply-input-${c.id}" class="form-input" placeholder="Reply to @${c.author}..." style="font-size: 12px; padding: 6px 12px;">
              <button class="btn-primary" style="font-size: 12px; padding: 6px 14px;" onclick="window.submitReply('${c.id}')">Reply</button>
              <button class="btn-secondary" style="font-size: 12px; padding: 6px 10px;" onclick="window.cancelReply()">Cancel</button>
            </div>
          ` : '';

          return `
            <div style="display: flex; gap: 12px;">
              <img src="${c.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'}" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex-shrink: 0;">
              <div style="flex: 1;">
                <div style="font-size: 13px; font-weight: 700;">
                  <span>${c.author}</span>
                  <span style="font-size: 11px; font-weight: 400; color: var(--text-muted); margin-left: 6px;">${c.time}</span>
                </div>
                <p style="font-size: 14px; margin-top: 4px; line-height: 1.4;">${c.text}</p>
                <div style="display: flex; align-items: center; gap: 12px; margin-top: 6px; font-size: 12px; color: var(--text-muted);">
                  <button style="cursor: pointer; display: flex; align-items: center; gap: 4px; background: none; border: none; color: var(--text-muted);" onclick="window.likeWatchComment('${c.id}', false)">
                    👍 <span>${c.likes || 0}</span>
                  </button>
                  <button style="cursor: pointer; background: none; border: none; color: var(--text-muted);" onclick="window.openReplyTo('${c.id}')">Reply</button>
                </div>
                ${replyBoxHtml}
                ${repliesHtml}
              </div>
            </div>
          `;
        }).join('');
      }

      window.openReplyTo = function(commentId) {
        activeReplyToId = commentId;
        renderComments();
        setTimeout(() => {
          const input = document.getElementById(`reply-input-${commentId}`);
          if (input) input.focus();
        }, 50);
      };

      window.cancelReply = function() {
        activeReplyToId = null;
        renderComments();
      };

      window.submitReply = function(commentId) {
        const input = document.getElementById(`reply-input-${commentId}`);
        if (!input) return;
        const text = input.value.trim();
        if (!text) return;

        const profile = storage.getUserProfile();
        const targetComment = comments.find(c => c.id === commentId);
        if (targetComment) {
          if (!targetComment.replies) targetComment.replies = [];
          targetComment.replies.push({
            id: 'cr-' + Date.now(),
            author: profile.name,
            avatar: profile.avatarUrl || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100',
            text: text,
            time: 'Just now',
            likes: 0
          });
          localStorage.setItem(`toktube_tube_comments_${video.id}`, JSON.stringify(comments));
          activeReplyToId = null;
          soundFX.playSubscribeSound();
          renderComments();
          tokShell.showToast('Reply posted! 💬');
        }
      };

      window.likeWatchComment = function(commentId, isReply, replyId) {
        const targetComment = comments.find(c => c.id === commentId);
        if (targetComment) {
          if (isReply && replyId && targetComment.replies) {
            const r = targetComment.replies.find(x => x.id === replyId);
            if (r) r.likes = (r.likes || 0) + 1;
          } else {
            targetComment.likes = (targetComment.likes || 0) + 1;
          }
          localStorage.setItem(`toktube_tube_comments_${video.id}`, JSON.stringify(comments));
          soundFX.playLikeSound();
          renderComments();
          tokShell.showToast('Liked comment ❤️');
        }
      };

      function handlePostComment() {
        const text = commentInput.value.trim();
        if (!text) {
          tokShell.showToast('Please type a comment first!');
          return;
        }
        const profile = storage.getUserProfile();
        const newComment = {
          id: 'c-' + Date.now(),
          author: profile.name,
          avatar: profile.avatarUrl || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100',
          text: text,
          time: 'Just now',
          likes: 0,
          replies: []
        };
        comments.unshift(newComment);
        localStorage.setItem(`toktube_tube_comments_${video.id}`, JSON.stringify(comments));
        commentInput.value = '';
        soundFX.playSubscribeSound();
        renderComments();
        tokShell.showToast('Comment posted! 💬');
      }

      postBtn.addEventListener('click', handlePostComment);
      commentInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handlePostComment();
      });

      renderComments();

      // Related Videos Queue
      const relatedList = document.getElementById('related-videos-list');
      const otherVideos = storage.getYoutubeVideos().filter(v => v.id !== video.id);

      relatedList.innerHTML = otherVideos.map(r => `
        <div style="display: flex; gap: 10px; cursor: pointer;" onclick="window.location.href='watch.html?v=${r.id}'">
          <div style="position: relative; width: 140px; aspect-ratio: 16/9; border-radius: var(--radius-sm); overflow: hidden; background: #202020; flex-shrink: 0;">
            <img src="${r.thumbnail}" style="width: 100%; height: 100%; object-fit: cover;">
            <span class="badge badge-duration" style="bottom: 4px; right: 4px; font-size: 10px; padding: 2px 4px;">${r.duration}</span>
          </div>
          <div style="flex: 1; min-width: 0;">
            <h4 style="font-size: 13px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${r.title}</h4>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">${r.channel.name}</div>
            <div style="font-size: 11px; color: var(--text-muted);">${(r.views || 0).toLocaleString()} views • ${r.timestamp}</div>
          </div>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
